[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gro-reporting"
version = "0.2.0"
description = "Automatisierte Kampagnen-Reports fuer MASSIVEART Kunden (BigQuery + Self-Service Web UI)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "weasyprint>=60.0",
    "google-ads>=24.0",
    "facebook-business>=19.0",
    "google-analytics-data>=0.18",
    "google-cloud-bigquery>=3.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gro-report = "gro_reporting.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
