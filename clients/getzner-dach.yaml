  - label: "Kontakte"
    actions: ["Klick E-Mail", "Klick Mail", "Klick Tel"]
  - label: "Lead-Formulare"
    actions: ["Lead Formular send", "Lead Form send", "Lead Form sent"]
    metric: all_conversions
  - label: "Downloads"
    actions: ["File Download"]

