# Beispiel-Konfiguration fuer einen neuen Kunden.
# Kopieren, umbenennen (z.B. kundenname.yaml) und anpassen.

client:
  name: "Firmenname des Kunden"
  slug: "kundenname"       # Kurzname, wird fuer Dateinamen verwendet

# Optional: Abrechnungswaehrung des Ads-Kontos (Default: EUR)
# currency: "CHF"

# Optional: Titelbild fuer die erste Seite
# cover_image: "assets/clients/kundenname/cover.jpg"

# Optional: Kundenlogo fuer die Titelseite
# client_logo: "assets/clients/kundenname/logo.png"

google_ads:
  customer_id: "123-456-7890"    # Google Ads Customer ID
  campaigns:
    pmax: ["PMAX*"]              # Glob-Patterns fuer PMAX-Kampagnen
    search: ["Search*"]          # Glob-Patterns fuer Suchanzeigen

# google_ads und meta_ads sind beide optional -- konfigurieren, was der
# Kunde nutzt. In UI/CLI laesst sich der Report pro Kanal oder kombiniert
# generieren (--channels google|meta|all).
meta_ads:
  ad_account_id: "act_123456789" # Meta Ad Account ID

# Optional: Conversion-KPIs fuer die Conversions-Seite (B2B/Lead-Kunden).
# Ohne conversion_groups zeigt die Seite Purchase + Umsatz (E-Commerce).
# actions: exakte Conversion-Action-Namen oder fnmatch-Wildcards;
# metric: all_conversions fuer sekundaere Actions (zaehlen nicht in der
# normalen Conversions-Spalte, z.B. Newsletter-Anmeldungen).
# conversion_groups:
#   - label: "Kontakte"
#     actions: ["Klick E-Mail", "Klick Tel"]
#   - label: "Newsletter"
#     actions: ["Anmeldung Newsletter*"]
#     metric: all_conversions

status_quo:
  next_steps: |
    Strategie: Beschreibung der naechsten Schritte
    Hier koennen mehrere Zeilen stehen.
  footnotes: []
