    actions: ["Download Eventkalender*", "Download Wochenprogramm*", "Prospekt Bestellung*"]
  - label: "Newsletter"
    actions: ["Anmeldung Newsletter*"]
    metric: all_conversions
  - label: "POI Kontakt"
    actions: ["POI Kontakt*"]
